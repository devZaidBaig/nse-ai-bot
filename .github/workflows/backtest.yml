name: Backtest

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history to test"
        default: "3"
  push:
    branches: [main]
    paths: ["bot/**", "requirements.txt"]   # re-test whenever the strategy changes
  schedule:
    # Refresh the backtest every Sunday 9:17 AM IST
    - cron: "47 3 * * 0"

permissions:
  contents: write

concurrency:
  group: research-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # always start from the latest state, even if this job waited in a queue
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backtest
        env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          WA_TEMPLATE: ${{ secrets.WA_TEMPLATE }}
          WA_TEMPLATE_LANG: ${{ secrets.WA_TEMPLATE_LANG }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.main backtest --years ${{ inputs.years || '3' }}
      - name: Save results
        run: |
          git config user.name "nse-ai-bot"
          git config user.email "nse-ai-bot@users.noreply.github.com"
          git add state/backtest.json
          git diff --cached --quiet || git commit -m "Backtest $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase --autostash && git push
