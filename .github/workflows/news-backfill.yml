name: News backfill (parallel)

on:
  push:
    branches: [main]
    paths: ["backfill-request.txt"]   # first word: gdelt-part or gdelt-vol-part
  workflow_dispatch:

permissions:
  contents: write

jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download news history (part ${{ matrix.part }} of 6)
        run: python -m bot.lab $(head -1 backfill-request.txt | awk '{print $1}') ${{ matrix.part }} 6 130 2>&1 | tee part.log
      - name: Save
        if: always()
        run: |
          git config user.name "nse-ai-bot"
          git config user.email "nse-ai-bot@users.noreply.github.com"
          git add state/data/gdelt
          git diff --cached --quiet && exit 0
          git commit -m "news backfill part ${{ matrix.part }} $(TZ=Asia/Kolkata date '+%F %H:%M')"
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep $((RANDOM % 20 + 5)); done

  retrain:
    needs: part
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train on the refreshed news data
        run: |
          mkdir -p state/lab
          set +e
          python -m bot.lab train 2>&1 | tee state/lab/last_output.txt
          echo "exit=${PIPESTATUS[0]} cmd=train (after news backfill) at $(TZ=Asia/Kolkata date '+%F %H:%M')" >> state/lab/last_output.txt
          exit 0
      - name: Save
        if: always()
        run: |
          git config user.name "nse-ai-bot"
          git config user.email "nse-ai-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet && exit 0
          git commit -m "lab train $(TZ=Asia/Kolkata date '+%F %H:%M') (after news backfill)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep 10; done
