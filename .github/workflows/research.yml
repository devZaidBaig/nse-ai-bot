name: Research

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history to test"
        default: "3"
  push:
    branches: [main]
    paths: ["bot/research.py"]

permissions:
  contents: write

concurrency:
  group: trading-state
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run experiments
        env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          WA_TEMPLATE: ${{ secrets.WA_TEMPLATE }}
          WA_TEMPLATE_LANG: ${{ secrets.WA_TEMPLATE_LANG }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.research --years ${{ inputs.years || '3' }}
      - name: Save results
        run: |
          git config user.name "nse-ai-bot"
          git config user.email "nse-ai-bot@users.noreply.github.com"
          git add state/research.json state/research.md
          git diff --cached --quiet && exit 0
          git commit -m "Research $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase --autostash && git push
