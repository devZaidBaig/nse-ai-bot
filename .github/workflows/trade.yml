name: Trade

on:
  schedule:
    # Intraday trailing-stop checks on live prices (IST): 10:05, 11:35, 13:05, 14:15
    - cron: "35 4 * * 1-5"
    - cron: "5 6 * * 1-5"
    - cron: "35 7 * * 1-5"
    - cron: "45 8 * * 1-5"
    # Main daily decision at 3:07 PM IST, market still open → trades at live prices
    - cron: "37 9 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [decide, watch, test-message]
        default: decide
      force:
        description: "Run even outside market hours / re-run today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trading-state
  cancel-in-progress: false

env:
  WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
  WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pick mode
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}";
          elif [ "${{ github.event.schedule }}" = "37 9 * * 1-5" ]; then MODE=decide; else MODE=watch; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install FinBERT (news AI)
        if: steps.m.outputs.mode == 'decide'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install "transformers>=4.44"
      - name: Cache FinBERT model
        if: steps.m.outputs.mode == 'decide'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-v1
      - name: Run bot
        run: python -m bot.main ${{ steps.m.outputs.mode }} ${{ inputs.force && '--force' || '' }}
      - name: Save portfolio & dashboard
        if: steps.m.outputs.mode != 'test-message'
        run: |
          git config user.name "nse-ai-bot"
          git config user.email "nse-ai-bot@users.noreply.github.com"
          git add state docs
          git diff --cached --quiet && exit 0
          git commit -m "${{ steps.m.outputs.mode }} $(TZ=Asia/Kolkata date '+%F %H:%M')"
          git pull --rebase --autostash && git push
